<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>捕获轨迹室 · Capture Trace Room</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>捕获轨迹室</h1>
  <div class="sub">自实现正则执行模型：AST · 匹配分支 · 捕获组更新 · 失败回退 · frontier 续跑</div>
  <div id="versions" class="versions"></div>
</header>

<main>
  <section class="card">
    <h2>1. Pattern 与执行控制</h2>
    <div class="row">
      <label>Pattern
        <input id="pattern" value="(?P&lt;year&gt;\d{4})-(?P&lt;mon&gt;\d{2})" spellcheck="false">
      </label>
      <label class="opt"><input type="checkbox" id="optimize"> 顺序保持优化</label>
      <button id="btnParse">解析 AST</button>
    </div>
    <div class="row">
      <label class="grow">输入 (UTF-8)
        <input id="input" value="2026-09" spellcheck="false">
      </label>
    </div>
    <div class="row">
      <button id="btnRun">运行</button>
      <button id="btnStep">单步</button>
      <button id="btnResume" disabled>从 frontier 继续</button>
      <button id="btnRunTo" disabled>运行到下一个暂停</button>
    </div>
    <div class="row">
      <label>断点：节点ID <input id="bpNode" type="number" min="0" style="width:90px"></label>
      <label>rune 位置 <input id="bpRune" type="number" min="-1" value="-1" style="width:90px"></label>
      <button id="btnAddBp">添加断点</button>
      <span id="bps" class="bps"></span>
    </div>
    <div class="row budgets">
      <label>步数预算 <input id="bSteps" type="number" value="200000"></label>
      <label>状态数预算 <input id="bStates" type="number" value="50000"></label>
      <label>捕获快照预算 <input id="bSnaps" type="number" value="50000"></label>
      <label>事件预算 <input id="bEvents" type="number" value="20000"></label>
      <label class="opt"><input type="checkbox" id="persist" checked> 持久化到 SQLite</label>
    </div>
  </section>

  <section class="card">
    <h2>2. AST</h2>
    <div id="ast" class="ast mono"></div>
  </section>

  <section class="card">
    <h2>3. 输入位置（字节 / code point）</h2>
    <div id="positions" class="mono positions"></div>
    <div id="cursor" class="cursor"></div>
  </section>

  <section class="card">
    <h2>4. 状态与结果</h2>
    <div id="status" class="status">尚未运行</div>
    <div id="match"></div>
    <div id="captures"></div>
    <div id="budgets"></div>
    <div id="frontierbox"></div>
  </section>

  <section class="card">
    <h2>5. 捕获轨迹（分支 / 捕获更新 / 失败回退 / 剪枝）</h2>
    <div class="row">
      <label>过滤
        <select id="filter">
          <option value="all">全部</option>
          <option value="branch">分支</option>
          <option value="capture">捕获更新</option>
          <option value="fail">失败回退</option>
          <option value="prune">剪枝</option>
          <option value="zero">零宽终止</option>
        </select>
      </label>
      <button id="btnClearTrace">清空</button>
    </div>
    <div class="tracewrap">
      <table id="trace">
        <thead><tr><th>#</th><th>事件</th><th>rune</th><th>byte</th><th>节点</th><th>活跃状态</th><th>详情</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>6. 语义差分（有限反例）</h2>
    <div class="row">
      <label class="grow">Pattern A <input id="dA" value="ab*" spellcheck="false"></label>
      <label class="grow">Pattern B <input id="dB" value="ab" spellcheck="false"></label>
    </div>
    <div class="row budgets">
      <label>最大长度 <input id="dLen" type="number" value="4" style="width:80px"></label>
      <label class="grow">字母表 <input id="dAlpha" value="ab" style="width:160px"></label>
      <label>反例上限 <input id="dMax" type="number" value="50" style="width:90px"></label>
      <button id="btnDiff">运行差分</button>
    </div>
    <div id="diffMeta" class="diffmeta"></div>
    <div class="tracewrap">
      <table id="diffTable">
        <thead><tr><th>#</th><th>长度</th><th>输入</th><th>A</th><th>B</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>7. 历史运行 (SQLite)</h2>
    <button id="btnHistory">刷新历史</button>
    <div id="history" class="history mono"></div>
  </section>
</main>

<template id="tplAstLeaf">-</template>
<script src="app.js"></script>
</body>
</html>
